services:
  - type: web
    name: absoracloud-api
    runtime: node
    buildCommand: npm install --production=false
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: APP_DOMAIN
        value: absoracloud.qzz.io
      - key: API_URL
        value: https://absoracloud.onrender.com
      - key: JWT_SECRET
        sync: false
      - key: WORKER_SECRET
        sync: false
      - key: CLOUDFLARE_EMAIL
        sync: false
      - key: CLOUDFLARE_GLOBAL_API_KEY
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_DOMAIN
        value: astrocore.qzz.io
      - key: CF_WORKERS_SUBDOMAIN
        value: absoracloud
      - key: D1_DB_ID
        sync: false
      - key: D1_DB_1_ID
        sync: false
      - key: D1_DB_2_ID
        sync: false
      - key: D1_DB_3_ID
        sync: false
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: UPSTASH_REDIS_TOKEN
        sync: false
      - key: KAGGLE_USERNAME
        sync: false
      - key: KAGGLE_KEY
        sync: false
      - key: PUSHER_APP_ID
        sync: false
      - key: PUSHER_KEY
        sync: false
      - key: PUSHER_SECRET
        sync: false
      - key: PUSHER_CLUSTER
        sync: false
      - key: ABLY_API_KEY
        sync: false
      - key: PIESOCKET_API_KEY
        sync: false
      - key: PIESOCKET_CLUSTER_ID
        sync: false
      - key: PIESOCKET_SECRET_KEY
        sync: false
      - key: SCALEDRONE_CHANNEL_ID
        sync: false
      - key: SCALEDRONE_SECRET_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: IMAGEKIT_PUBLIC_KEY
        sync: false
      - key: IMAGEKIT_PRIVATE_KEY
        sync: false
      - key: IMAGEKIT_URL_ENDPOINT
        sync: false
      - key: GITHUB_OWNER
        value: AADI-DEV1012
      - key: GITHUB_REPO
        value: Absoracloud
