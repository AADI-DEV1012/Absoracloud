name: AbsoraCloud VPS Runner
on:
  workflow_dispatch:
    inputs:
      session_key:
        required: true
        description: "Session key for this VPS instance"
      plan:
        required: false
        default: "free"
        description: "User plan tier"

permissions:
  contents: read

jobs:
  vps-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      UPSTASH_REDIS_URL:   ${{ secrets.UPSTASH_REDIS_URL }}
      UPSTASH_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_TOKEN }}
      WORKER_SECRET:       ${{ secrets.WORKER_SECRET }}
      API_URL:             ${{ secrets.API_URL }}
      RUNNER_ID:           "vps-${{ github.run_id }}"
      INITIAL_SESSION_KEY: ${{ github.event.inputs.session_key }}
      PLAN:                ${{ github.event.inputs.plan || 'free' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Environment
        run: |
          echo "═══════════════════════════════════════════"
          echo "  AbsoraCloud VPS Runner"
          echo "  Runner ID : $RUNNER_ID"
          echo "  Capacity  : 4 vCPU, 16 GB RAM"
          echo "═══════════════════════════════════════════"

          pip install requests websockets psutil --quiet

          # Install cloudflared
          curl -sL --output cloudflared.deb \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i cloudflared.deb

          # Build base Docker image with mirror resilience
          cat > /tmp/Dockerfile <<'DOCKERFILE'
          FROM ubuntu:22.04
          ENV DEBIAN_FRONTEND=noninteractive
          RUN rm -rf /var/lib/apt/lists/* && \
              apt-get update --fix-missing && \
              (apt-get install -y --fix-missing --no-install-recommends \
                bash curl wget git nano vim \
                python3 python3-pip \
                gcc g++ make \
                net-tools iputils-ping dnsutils \
                ca-certificates || \
              (apt-get update --fix-missing && apt-get install -y --fix-missing --no-install-recommends \
                bash curl wget git nano vim \
                python3 python3-pip \
                gcc g++ make \
                net-tools iputils-ping dnsutils \
                ca-certificates)) && \
              (curl -fsSL https://deb.nodesource.com/setup_20.x | bash - && apt-get install -y --no-install-recommends nodejs || true) && \
              (curl -sLo /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 && chmod +x /usr/local/bin/ttyd || true) && \
              rm -rf /var/lib/apt/lists/*
          RUN mkdir -p /root/files
          WORKDIR /root
          CMD ["sleep", "infinity"]
          DOCKERFILE
          docker build -t absoracloud-base -f /tmp/Dockerfile /tmp

      - name: Start VPS Server
        run: |
          cd runners/vps-server
          python3 shared_server.py

