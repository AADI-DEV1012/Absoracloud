name: AbsoraCloud MC Runner
on:
  workflow_dispatch:
    inputs:
      session_key:
        required: true
        description: "Initial session key for this MC instance"
      user_id:
        required: false
      plan:
        required: false
      server_type:
        required: false
        default: 'paper'
      version:
        required: false
        default: '1.20.4'
      java_version:
        required: false
        default: 'auto'
      ram_mb:
        required: false
        default: '1024'

permissions:
  contents: read

jobs:
  mc-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      UPSTASH_REDIS_URL:   ${{ secrets.UPSTASH_REDIS_URL }}
      UPSTASH_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_TOKEN }}
      WORKER_SECRET:       ${{ secrets.WORKER_SECRET }}
      API_URL:             ${{ secrets.API_URL }}
      RUNNER_ID:           "mc-${{ github.run_id }}"
      INITIAL_SESSION_KEY: ${{ github.event.inputs.session_key }}
      PLAN:                ${{ github.event.inputs.plan || 'free' }}
      SERVER_TYPE:         ${{ github.event.inputs.server_type || 'paper' }}
      VERSION:             ${{ github.event.inputs.version || '1.20.4' }}
      JAVA_VERSION:        ${{ github.event.inputs.java_version || 'auto' }}
      RAM_MB:              ${{ github.event.inputs.ram_mb || '1024' }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Primary Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Additional Java Versions (17, 11, 8)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openjdk-17-jre-headless openjdk-11-jre-headless openjdk-8-jre-headless || true

      - name: Setup Python Environment
        run: |
          echo "═══════════════════════════════════════════"
          echo "  AbsoraCloud Minecraft Runner"
          echo "  Runner ID    : $RUNNER_ID"
          echo "  Capacity     : 2 Multi-Tenant Servers"
          echo "  Server Type  : $SERVER_TYPE"
          echo "  MC Version   : $VERSION"
          echo "  Java Version : $JAVA_VERSION"
          echo "═══════════════════════════════════════════"
          pip install requests psutil --quiet

      - name: Start Multi-Tenant MC Daemon
        run: |
          cd runners/mc-daemon
          python3 shared_mc.py
